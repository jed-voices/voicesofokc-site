name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Run regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Python unittests
        run: python3 -m unittest discover -s tests -v

      - name: Node summary rendering tests
        run: node tests/test_summary_rendering.cjs

      - name: Node featured-guest fallback test
        run: node tests/test_featured_guest_fallback.cjs

      - name: JS syntax checks
        run: |
          node --check assets/js/episodes.js
          node --check assets/js/player.js

      - name: Whitespace check
        run: git diff --check HEAD
